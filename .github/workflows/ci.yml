name: Floward Clone
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: floward
          POSTGRES_PASSWORD: floward
          POSTGRES_DB: floward_clone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: floward_clone.settings.dev
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://floward:floward@localhost:5432/floward_clone
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      USE_S3: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: flake8
        run: flake8 .

      - name: black --check
        run: black --check .

      - name: isort --check
        run: isort --check .

      - name: makemigrations --check --dry-run
        run: python manage.py makemigrations --check --dry-run

      - name: migrate
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: pytest
        run: pytest
